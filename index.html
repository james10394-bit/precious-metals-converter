<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>貴金屬換算器｜現貨價與新台幣</title>
  <meta name="description" content="金、銀、鉑、鈀現貨價格，台灣錢與公克換算，以及美元、新台幣等貨幣轉換。">
  <meta name="application-version" content="1.0.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171c27'/%3E%3Cpath d='M13 43 22 19h20l9 24H13Zm9-8h20l-4-10H26l-4 10Z' fill='%23d7ab64'/%3E%3C/svg%3E">
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#e9edf3;background:#10141d;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}main{max-width:1120px;margin:auto;padding:32px 24px 80px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{color:#d7ab64;font-size:.86rem;font-weight:700;letter-spacing:.14em}h1{font-size:clamp(1.65rem,4vw,2.35rem);line-height:1.25;margin:8px 0 0}h2{font-size:1.18rem;margin:0 0 20px}.sub{color:#aeb7c6;font-size:.9rem;line-height:1.6;margin:8px 0 0}.refresh{background:transparent;color:#e8d1ad;border:1px solid #63543e;border-radius:12px;padding:10px 16px;white-space:nowrap}.refresh:hover{background:#2a251e}.status{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.pill{border:1px solid #343d4c;background:#1b222e;padding:9px 13px;border-radius:9px;color:#b8c2d1;font-size:.85rem}.pill strong{color:#e9edf3;font-weight:600}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,.8fr);gap:18px}.panel{background:#1b222e;border:1px solid #303947;border-radius:20px;padding:25px;box-shadow:0 12px 40px #0002}.main-panel{border-top:3px solid #cba15f}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:flex;flex-direction:column;gap:8px;color:#b8c2d1;font-size:.9rem;font-weight:600}input,select{width:100%;min-height:49px;border:1px solid #445061;border-radius:11px;padding:11px 13px;background:#111722;color:#f2f3f5;outline:none}input:focus,select:focus{border-color:#d7ab64;box-shadow:0 0 0 3px #d7ab6433}.result{background:linear-gradient(135deg,#302b27,#232832);border:1px solid #68553d;border-radius:16px;padding:24px;margin-top:22px}.result .caption{color:#e1c89e;font-size:.9rem}.amount{font-size:clamp(2rem,5vw,3.1rem);font-weight:760;letter-spacing:-.03em;line-height:1.2;margin:8px 0;overflow-wrap:anywhere}.formula{font-size:.89rem;color:#b8c2d1;line-height:1.6}.invalid{color:#efa99e}.spot-list{display:grid;gap:9px;margin:19px 0 0}.spot-row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #343c49;font-size:.92rem}.spot-row b{font-variant-numeric:tabular-nums}.spot-row:last-child{border:0}.small{font-size:.83rem;line-height:1.65;color:#9ca9ba}.fx-result{font-size:1.8rem;font-weight:700;margin:19px 0 4px;overflow-wrap:anywhere}.fx-card{border-top:1px solid #36404c;margin-top:22px;padding-top:20px}.footer{margin-top:20px;color:#9daaba;font-size:.83rem;line-height:1.75}.footer a{color:#e1bd82}.error{color:#efa99e}.swap{align-self:end;height:49px;background:#303b4c;border:1px solid #4b5666;color:#fff;border-radius:11px}.currency-fields{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}@media(max-width:790px){main{padding:24px 16px 60px}.grid{grid-template-columns:1fr}.panel{padding:19px}}@media(max-width:470px){header{align-items:center}.refresh{padding:9px 11px}.fields{gap:12px}.currency-fields{grid-template-columns:1fr auto 1fr}.status{gap:7px}.pill{font-size:.79rem}.amount{font-size:2rem}}
  </style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">PRECIOUS METALS · TWD <span style="color:#aeb7c6;letter-spacing:0;font-weight:500">v1.0.0</span></div><h1>貴金屬換算器</h1><p class="sub">選擇金屬、重量與純度，立即估算現貨價值。</p></div><button class="refresh" id="refresh" type="button">更新報價 ↻</button></header>
  <div class="status" aria-live="polite"><div class="pill">金屬報價：<strong id="metalStatus">讀取中…</strong></div><div class="pill">匯率：<strong id="fxStatus">讀取中…</strong></div></div>
  <div class="grid">
    <section class="panel main-panel" aria-labelledby="metalHeading">
      <h2 id="metalHeading">現貨價值換算</h2>
      <div class="fields">
        <label>貴金屬<select id="metal"><option value="XAU">黃金 Au</option><option value="XAG">白銀 Ag</option><option value="XPT" selected>鉑金 Pt</option><option value="XPD">鈀金 Pd</option></select></label>
        <label>重量<input id="weight" type="number" inputmode="decimal" min="0" step="any" value="6.5"></label>
        <label>重量單位<select id="unit"><option value="qian">錢（3.75 公克）</option><option value="gram">公克（g）</option><option value="tael">台兩（37.5 公克）</option><option value="toz">金衡盎司（31.1034768 公克）</option></select></label>
        <label>純度<select id="purity"><option value="1">純金屬 100%</option><option value="0.999">999（99.9%）</option><option value="0.95" selected>Pt950／95%</option><option value="0.9">90%</option><option value="0.75">18K／75%</option><option value="0.585">14K／58.5%</option></select></label>
        <label>顯示幣別<select id="displayCurrency"><option value="TWD">新台幣 TWD</option><option value="USD">美元 USD</option><option value="JPY">日圓 JPY</option><option value="EUR">歐元 EUR</option><option value="HKD">港幣 HKD</option><option value="SGD">新加坡幣 SGD</option><option value="GBP">英鎊 GBP</option><option value="CNY">人民幣 CNY</option></select></label>
      </div>
      <div class="result" aria-live="polite"><div class="caption">按國際現貨價估算</div><div class="amount" id="metalResult">讀取報價中…</div><div class="formula" id="metalFormula">—</div></div>
      <div class="spot-list" id="spotList" aria-label="每金衡盎司美元現貨報價"></div>
    </section>
    <aside class="panel" aria-labelledby="currencyHeading">
      <h2 id="currencyHeading">貨幣轉換</h2>
      <label>金額<input id="fxAmount" type="number" inputmode="decimal" min="0" step="any" value="100"></label>
      <div class="currency-fields" style="margin-top:15px"><label>從<select id="fxFrom"></select></label><button id="swap" class="swap" type="button" aria-label="交換幣別">⇄</button><label>換成<select id="fxTo"></select></label></div>
      <div class="fx-card" aria-live="polite"><div class="small">參考匯率換算</div><div class="fx-result" id="fxResult">讀取匯率中…</div><div class="small" id="fxFormula">—</div></div>
      <p class="small">匯率為參考中間價，實際換匯、刷卡與收購價格會有價差。</p>
    </aside>
  </div>
  <p class="footer">金屬來源：<a href="https://gold-api.com/docs" target="_blank" rel="noopener">Gold API</a>（每金衡盎司美元現貨價）；匯率來源：<a href="https://frankfurter.dev/" target="_blank" rel="noopener">Frankfurter</a>（每日參考匯率）。每 60 秒嘗試更新金屬報價，匯率每 15 分鐘檢查一次。估算僅供參考，實際回收價還須考慮純度檢測、耗損與店家報價。</p>
</main>
<script>
(()=>{'use strict';
 const symbols={XAU:'黃金',XAG:'白銀',XPT:'鉑金',XPD:'鈀金'}, units={qian:3.75,gram:1,tael:37.5,toz:31.1034768}, currencies={TWD:'新台幣 TWD',USD:'美元 USD',JPY:'日圓 JPY',EUR:'歐元 EUR',HKD:'港幣 HKD',SGD:'新加坡幣 SGD',GBP:'英鎊 GBP',CNY:'人民幣 CNY'};
 const $=id=>document.getElementById(id), state={metals:{},rates:{USD:1},metalTimes:{},fxDate:null,metalError:false,fxError:false};
 for(const id of ['fxFrom','fxTo'])for(const [code,name] of Object.entries(currencies)){const o=document.createElement('option');o.value=code;o.textContent=name;$(id).append(o)}
 $('fxFrom').value='USD';$('fxTo').value='TWD';
 const fmt=(n,code)=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:code,maximumFractionDigits:code==='JPY'?0:2}).format(n);
 const num=n=>new Intl.NumberFormat('zh-TW',{maximumFractionDigits:4}).format(n);
 function show(){const m=$('metal').value,w=Number($('weight').value),p=Number($('purity').value),c=$('displayCurrency').value,price=state.metals[m],rate=state.rates[c],g=w*units[$('unit').value];if(!$('weight').value||!Number.isFinite(w)||w<0){$('metalResult').textContent='請輸入有效重量';$('metalResult').classList.add('invalid');$('metalFormula').textContent='重量須為零或正數';}else if(!Number.isFinite(price)||!Number.isFinite(rate)){$('metalResult').textContent='目前無法取得報價';$('metalResult').classList.add('invalid');$('metalFormula').textContent='請稍後按「更新報價」重試';}else{let usd=g*p/units.toz*price;$('metalResult').textContent=fmt(usd*rate,c);$('metalResult').classList.remove('invalid');$('metalFormula').textContent=`${num(w)} ${$('unit').selectedOptions[0].textContent.split('（')[0]} × ${num(p*100)}% 純度 = ${num(g*p)} 公克純金屬；現貨 ${fmt(price,'USD')}／金衡盎司`;}
 const a=Number($('fxAmount').value),from=$('fxFrom').value,to=$('fxTo').value,rf=state.rates[from],rt=state.rates[to];if(!$('fxAmount').value||!Number.isFinite(a)||a<0){$('fxResult').textContent='請輸入有效金額';$('fxFormula').textContent='金額須為零或正數'}else if(!Number.isFinite(rf)||!Number.isFinite(rt)){$('fxResult').textContent='匯率暫不可用';$('fxFormula').textContent='請稍後重試'}else{$('fxResult').textContent=fmt(a/rf*rt,to);$('fxFormula').textContent=`1 ${from} ≈ ${num(rt/rf)} ${to}`}
 $('spotList').replaceChildren(...Object.entries(symbols).map(([code,name])=>{const row=document.createElement('div');row.className='spot-row';const label=document.createElement('span');label.textContent=`${name} · ${code}`;const val=document.createElement('b');val.textContent=Number.isFinite(state.metals[code])?fmt(state.metals[code],'USD'):'—';row.append(label,val);return row}));
 const times=Object.values(state.metalTimes).filter(Boolean).sort();$('metalStatus').textContent=times.length?`${new Date(times.at(-1)).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})} 台灣時間${state.metalError?' · 部分更新失敗':''}`:state.metalError?'無法連線 · 請重試':'讀取中…';
 $('fxStatus').textContent=state.fxDate?`${state.fxDate} 參考價${state.fxError?' · 更新失敗':''}`:state.fxError?'無法連線 · 請重試':'讀取中…';
 }
 async function getJSON(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const res=await fetch(url,{signal:controller.signal,cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);return await res.json()}finally{clearTimeout(timer)}}
 async function metalFetch(){const results=await Promise.allSettled(Object.keys(symbols).map(async code=>{const d=await getJSON(`https://api.gold-api.com/price/${code}`);const price=Number(d.price);if(!Number.isFinite(price)||price<=0)throw Error('invalid price');return {code,price,time:d.updatedAt||d.updated_at||d.timestamp||new Date().toISOString()}}));state.metalError=results.some(r=>r.status==='rejected');for(const r of results)if(r.status==='fulfilled'){state.metals[r.value.code]=r.value.price;const t=new Date(r.value.time);state.metalTimes[r.value.code]=Number.isFinite(t.getTime())?t.toISOString():new Date().toISOString()}show()}
 async function fxFetch(){try{const d=await getJSON('https://api.frankfurter.dev/v2/rates?base=usd&quotes=twd,jpy,eur,hkd,sgd,gbp,cny');if(!Array.isArray(d))throw Error('invalid rates');const rates=Object.fromEntries(d.map(row=>[row.quote.toUpperCase(),Number(row.rate)]));if(!Number.isFinite(rates.TWD))throw Error('missing TWD');state.rates={USD:1,...rates};state.fxDate=d.find(row=>row.quote.toUpperCase()==='TWD')?.date;state.fxError=false}catch(e){state.fxError=true}show()}
 let refreshing=false;async function refresh(){if(refreshing)return;refreshing=true;$('refresh').disabled=true;$('refresh').textContent='更新中…';await Promise.all([metalFetch(),fxFetch()]);$('refresh').disabled=false;$('refresh').textContent='更新報價 ↻';refreshing=false}
 for(const id of ['metal','weight','unit','purity','displayCurrency','fxAmount','fxFrom','fxTo'])$(id).addEventListener('input',show);
 $('swap').addEventListener('click',()=>{const a=$('fxFrom').value;$('fxFrom').value=$('fxTo').value;$('fxTo').value=a;show()});$('refresh').addEventListener('click',refresh);
 show();refresh();setInterval(metalFetch,60000);setInterval(fxFetch,900000);
})();
</script>
</body>
</html>
